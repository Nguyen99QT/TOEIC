# ======================================
# SPRING BOOT DEVTOOLS CONFIGURATION
# ======================================

# Enable DevTools
spring.devtools.restart.enabled=true

# Exclude certain directories from restart trigger
spring.devtools.restart.exclude=static/**,public/**

# Enable LiveReload (tự động refresh browser)
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

# Fast restart by excluding certain paths
spring.devtools.restart.additional-exclude=**/*.log,**/*.tmp

# Show restart logs
logging.level.org.springframework.boot.devtools=DEBUG

# Optional: Disable cache for templates during development
spring.thymeleaf.cache=false
spring.freemarker.cache=false
spring.mustache.cache=false

