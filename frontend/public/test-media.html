<!DOCTYPE html>
<html>
<head>
    <title>Test Audio and Image</title>
</head>
<body>
    <h1>Test Media từ Backend</h1>
    
    <h2>Test Image</h2>
    <img src="http://localhost:8080/uploads/images/sample_part1_image.jpg" 
         alt="Test image" 
         style="max-width: 300px; border: 1px solid #ccc;">
    
    <h2>Test Audio</h2>
    <audio controls>
        <source src="http://localhost:8080/uploads/audio/sample_part1_audio.mp3" type="audio/mpeg">
        Browser không hỗ trợ audio
    </audio>
    
    <h2>Test Image 2</h2>
    <img src="http://localhost:8080/uploads/images/sample_part1_image2.jpg" 
         alt="Test image 2" 
         style="max-width: 300px; border: 1px solid #ccc;">
    
    <h2>Test Audio 2</h2>
    <audio controls>
        <source src="http://localhost:8080/uploads/audio/sample_part1_audio2.mp3" type="audio/mpeg">
        Browser không hỗ trợ audio
    </audio>
</body>
</html>
