<!DOCTYPE html>
<html>
  <head>
    <title>Test Login</title>
  </head>
  <body>
    <h1>Test Login for TOEIC Platform</h1>
    <button onclick="testLogin()">Test Login with teacher2</button>
    <button onclick="checkAuth()">Check Auth Status</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <div id="result"></div>

    <script>
      async function testLogin() {
        const result = document.getElementById("result");
        result.innerHTML = "Testing login...";

        try {
          const response = await fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              username: "teacher2",
              password: "password123",
            }),
          });

          const data = await response.json();
          console.log("Login response:", data);

          if (data.token || data.accessToken) {
            const token = data.token || data.accessToken;
            localStorage.setItem("toeic_access_token", token);
            localStorage.setItem(
              "toeic_current_user",
              JSON.stringify({
                id: data.id,
                username: data.username,
                email: data.email,
                role: data.roles[0].replace("ROLE_", ""),
                fullName: data.username,
                membershipType: "FREE",
              })
            );

            result.innerHTML = `
                        <p>✅ Login successful!</p>
                        <p>Token: ${token.substring(0, 30)}...</p>
                        <p>User: ${data.username}</p>
                        <p>Role: ${data.roles[0]}</p>
                        <p><a href="http://localhost:3000/dashboard" target="_blank">Go to Dashboard</a></p>
                    `;
          } else {
            result.innerHTML = "❌ Login failed: No token received";
          }
        } catch (error) {
          console.error("Login error:", error);
          result.innerHTML = `❌ Login failed: ${error.message}`;
        }
      }

      function checkAuth() {
        const result = document.getElementById("result");
        const token = localStorage.getItem("toeic_access_token");
        const user = localStorage.getItem("toeic_current_user");

        result.innerHTML = `
                <p><strong>Auth Status:</strong></p>
                <p>Token: ${
                  token
                    ? "✅ Present (" + token.substring(0, 30) + "...)"
                    : "❌ Missing"
                }</p>
                <p>User: ${
                  user
                    ? "✅ Present (" + JSON.parse(user).username + ")"
                    : "❌ Missing"
                }</p>
                <p>All localStorage keys: ${Object.keys(localStorage).join(
                  ", "
                )}</p>
            `;
      }

      function clearStorage() {
        localStorage.clear();
        document.getElementById("result").innerHTML = "🧹 Storage cleared!";
      }
    </script>
  </body>
</html>
