spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers,Current-User-Id
spring.web.cors.allow-credentials=true
spring.web.cors.exposed-headers=Authorization,Access-Control-Allow-Origin
spring.web.cors.max-age=3600

