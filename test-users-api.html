<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Users API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 8px; margin: 5px 0; }
        input { width: 300px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; background: #f9f9f9; }
        .error { background: #ffe6e6; border-color: #ff9999; }
        .success { background: #e6ffe6; border-color: #99ff99; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Users API</h1>
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" value="admin" />
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" value="admin123" />
        </div>
        
        <button onclick="login()">Login</button>
        <button onclick="getUsers()">Get Users</button>
        <button onclick="clearResult()">Clear Result</button>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        let authToken = '';
        let currentUserId = '';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    currentUserId = data.user.id;
                    showResult('Login successful! Token: ' + authToken.substring(0, 50) + '...', 'success');
                } else {
                    showResult('Login failed: ' + data.message, 'error');
                }
            } catch (error) {
                showResult('Login error: ' + error.message, 'error');
            }
        }

        async function getUsers() {
            if (!authToken) {
                showResult('Please login first!', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/users?page=0&size=10', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Current-User-Id': currentUserId,
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult('Users API Response: ' + JSON.stringify(data, null, 2), 'success');
                } else {
                    showResult('Get Users failed: ' + JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                showResult('Get Users error: ' + error.message, 'error');
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = 'result ' + type;
            resultDiv.style.display = 'block';
        }

        function clearResult() {
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
