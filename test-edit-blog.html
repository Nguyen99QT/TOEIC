<!DOCTYPE html>
<html>
<head>
    <title>Test Edit Blog API</title>
</head>
<body>
    <h1>Test Edit Blog Save</h1>
    <button onclick="testEditBlog()">Test Save Blog ID 3</button>
    <div id="result"></div>

    <script>
        async function testEditBlog() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';

            try {
                // Get token từ localStorage
                const token = localStorage.getItem('toeic_access_token') || 
                              localStorage.getItem('authToken') ||
                              localStorage.getItem('accessToken');

                console.log('🔐 Token found:', !!token);
                
                if (!token) {
                    resultDiv.innerHTML = '❌ No token found! Please login at localhost:3000 first';
                    return;
                }

                // Tạo FormData
                const formData = new FormData();
                formData.append('title', 'Test Edit Title ' + new Date().getTime());
                formData.append('content', 'Test Edit Content ' + new Date().getTime());

                console.log('🚀 Sending PUT request to: http://localhost:8080/api/blog/3/upload');

                const response = await fetch('http://localhost:8080/api/blog/3/upload', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                console.log('📥 Response status:', response.status);
                console.log('📥 Response ok:', response.ok);

                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ Update successful:', result);
                    resultDiv.innerHTML = '✅ Success! Blog updated successfully';
                } else {
                    const errorData = await response.text();
                    console.error('❌ Update failed:', {
                        status: response.status,
                        statusText: response.statusText,
                        error: errorData
                    });
                    resultDiv.innerHTML = `❌ Failed: ${response.status} - ${errorData}`;
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                resultDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
